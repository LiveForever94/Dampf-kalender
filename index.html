  function showErr(msg) {
    document.getElementById('loader').innerHTML =
      '<span style="font-size:32px">⚠️</span>' +
      '<p style="color:#ef4444;font-family:monospace;padding:20px;text-align:center">' +
      msg + '</p>';
  }
  function setStatus(t){ var s=document.getElementById('st'); if(s) s.textContent=t; }

  function loadScript(src, cb) {
    setStatus('Lade ' + src.split('/').pop().split('?')[0] + '…');
    var s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = cb;
    s.onerror = function(){ showErr('Netzwerkfehler: ' + src); };
    document.head.appendChild(s);
  }

  function b64decode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  loadScript('https://unpkg.com/react@18/umd/react.production.min.js', function() {
    loadScript('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js', function() {
      setStatus('Lade Babel…');
      loadScript('https://unpkg.com/@babel/standalone/babel.min.js', function() {
        setStatus('Kompiliere App…');
        setTimeout(function() {
          try {
            var src = b64decode(APP_SRC_B64);
            var out = Babel.transform(src, {
              presets: [['react', { runtime: 'classic' }]],
              sourceType: 'script'
            }).code;
            var fn = new Function('React', 'ReactDOM', out + '\nreturn SonderfahrtenKalender;');
            var Comp = fn(window.React, window.ReactDOM);
            ReactDOM.createRoot(document.getElementById('root'))
              .render(React.createElement(Comp));
            document.getElementById('loader').style.display = 'none';
          } catch(e) {
            showErr(e.message);
          }
        }, 50);
      });
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
  }
  var dp;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); dp=e;
    document.getElementById('ibtn').style.display='block';
  });
  document.getElementById('ibtn').addEventListener('click', function(){
    if(!dp)return; dp.prompt();
    dp.userChoice.then(function(){ dp=null; document.getElementById('ibtn').style.display='none'; });
  });
  </script>
