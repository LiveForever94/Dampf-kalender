function SonderfahrtenKalender() {
 const pd = s => { const [y,m,d] = s.split("-").map(Number); return {y, m:m-1, d}; };
 const [selectedMonth, setSelectedMonth] = useState(3);
 const [selectedOrg, setSelectedOrg] = useState("Alle");
 const [selectedType, setSelectedType] = useState("Alle");
 const [showRegelfahrten, setShowRegelfahrten] = useState(false);
 const [activeTab, setActiveTab] = useState("sonderfahrten");
 const [llFilter, setLlFilter] = useState("Alle");
 const [llDayFilter, setLlDayFilter] = useState("Alle");
 const [expandedLL, setExpandedLL] = useState({});

 const llBundeslaender = ["Alle", ...new Set(laufleistungen.map(l => l.bl.split("/")[0].trim()))];

 const llMatchesDay = (ll, day) => {
 if (day === "Alle") return true;
 const kuerzel = { "Mo":"Mo", "Di":"Di", "Mi":"Mi", "Do":"Do", "Fr":"Fr", "Sa":"Sa", "So":"So" }[day];
 const haystack = ll.takt + " " + (ll.note||"") + " " + (ll.fahrplan ? ll.fahrplan.map(u => u.umlauf + " " + (u.zeilen||[]).join(" ")).join(" ") : "");
 if (haystack.includes("taeglich") || haystack.includes("täglich")) return true;
 if (day === "So" && haystack.includes("taeglich")) return true;
 if (["Mo","Di","Mi","Do","Fr"].includes(day) && (haystack.includes("Mo–Fr") || haystack.includes("Mo-Fr") || haystack.includes("Mo–Sa") || haystack.includes("Mo-Sa"))) return true;
 if (["Mo","Di","Mi","Do","Fr","Sa"].includes(day) && (haystack.includes("Mo–Sa") || haystack.includes("Mo-Sa"))) return true;
 return haystack.includes(kuerzel);
 };

 const llFiltered = laufleistungen
 .filter(l => llFilter === "Alle" || l.bl.includes(llFilter))
 .filter(l => llMatchesDay(l, llDayFilter));

 const applyBaseFilter = (evs) => evs.filter(e => showRegelfahrten || e.type !== "Regelfahrt");
 const allFiltered = applyBaseFilter(
 events.filter(e => {
 if (selectedType !== "Alle" && e.type !== selectedType) return false;
 if (selectedOrg !== "Alle" && e.org !== selectedOrg) return false;
 return true;
 })
 );
 const orgs = ["Alle", ...new Set(events.map(e => e.org))].sort((a,b) => a === "Alle" ? -1 : a.localeCompare(b));
 const filtered = allFiltered.filter(e => pd(e.date).m === selectedMonth);

 const firstDay = new Date(2026, selectedMonth, 1).getDay();
 const offset = (firstDay + 6) % 7;
 const daysInMonth = new Date(2026, selectedMonth + 1, 0).getDate();
 const calCells = [...Array(offset).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

 const eventsByDay = {};
 filtered.forEach(e => {
 const {d} = pd(e.date);
 if (!eventsByDay[d]) eventsByDay[d] = [];
 eventsByDay[d].push(e);
 });

 const monthCounts = {};
 MONTHS.forEach((_, i) => {
 monthCounts[i] = allFiltered.filter(e => pd(e.date).m === i).length;
 });

 return (
 <div style={{ minHeight:"100vh", background:"#0a0a0f", fontFamily:"'Georgia','Times New Roman',serif", color:"#e8e0d0" }}>
 <div style={{ background:"linear-gradient(135deg,#1a0a00,#0f1a2e 50%,#0a0f1a)", borderBottom:"1px solid #2a2a3a", padding:"22px 14px 16px", position:"relative", overflow:"hidden" }}>

 Dampf &amp; Nostalgie<br /><span style={{ color:"#f97316" }}>{activeTab === "sonderfahrten" ? "Sonderfahrten" : "Laufleistungen"}</span>
 </h1>

  <script>
    function loadBabelAndRun() {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/@babel/standalone/babel.min.js';
      script.onload = function() {
        try {
          var src = document.getElementById('app-source').textContent;
          var compiled = Babel.transform(src, { presets: ['react'], sourceType: 'script' }).code;
          var fn = new Function('React', 'ReactDOM', compiled + '\nreturn SonderfahrtenKalender;');
          var Comp = fn(React, ReactDOM);
          var root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(Comp));
          document.getElementById('loader').style.display = 'none';
        } catch(e) {
          document.getElementById('loader').innerHTML =
            '<p style="color:#ef4444;font-family:monospace;padding:20px;text-align:center">' +
            '⚠️ ' + e.message + '</p>';
        }
      };
      script.onerror = function() {
        document.getElementById('loader').innerHTML =
          '<p style="color:#ef4444;font-family:monospace;padding:20px;text-align:center">' +
          '⚠️ Babel konnte nicht geladen werden.<br><small>Bitte Internetverbindung prüfen.</small></p>';
      };
      document.head.appendChild(script);
    }
    window.addEventListener('load', loadBabelAndRun);

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // PWA Install
    var deferredPrompt;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault(); deferredPrompt = e;
      document.getElementById('install-btn').style.display = 'block';
    });
    document.getElementById('install-btn').addEventListener('click', function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() {
        deferredPrompt = null;
        document.getElementById('install-btn').style.display = 'none';
      });
    });
  </script>
